<div class="container mx-auto px-4 py-8">
	<div class="flex justify-between items-center mb-6">
		<h1 class="text-2xl font-bold text-gray-800">Products</h1>
		<button *ngIf="isAdmin()" (click)="addProduct()"
			class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg transition">
			Add Product
		</button>
	</div>

	<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
		<div *ngFor="let product of products()" class="bg-white rounded-lg shadow-lg overflow-hidden">
			<img *ngIf="product.imageUrl" [src]="product.imageUrl" [alt]="product.name"
				class="w-full h-48 object-cover" />
			<div class="p-4">
				<h3 class="text-xl font-semibold text-gray-800">{{ product.name }}</h3>
				<p class="text-gray-600 mt-2">{{ product.description }}</p>
				<div class="flex justify-between items-center mt-4">
					<span class="text-2xl font-bold text-indigo-600">{{ product.price | currency }}</span>
					<button class="bg-indigo-100 text-indigo-700 px-4 py-2 rounded-lg hover:bg-indigo-200 transition">
						View Details
					</button>
				</div>
			</div>
		</div>
	</div>
</div>
